name: Deploy production

on:
  push:
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bibo-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy prod to cPanel
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_PATH: /home/biboco/bibo-erm

    steps:
      - name: Check out prod
        uses: actions/checkout@v6
        with:
          ref: prod
          fetch-depth: 1

      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Validate deployment settings
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?DEPLOY_HOST is not configured}"
          : "${DEPLOY_USER:?DEPLOY_USER is not configured}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          echo "DEPLOY_PORT=$DEPLOY_PORT" >> "$GITHUB_ENV"

      - name: Verify SSH access
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "test -d '$DEPLOY_PATH' && test -f '$DEPLOY_PATH/backend/artisan'"

      - name: Synchronize prod source
        run: |
          set -euo pipefail
          rsync --archive --compress --delete-after --itemize-changes \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/backend/.env' \
            --exclude='/backend/storage/' \
            --exclude='/backend/vendor/' \
            --exclude='/frontend/.env.local' \
            --exclude='/frontend/.env.production' \
            --exclude='/frontend/.next/' \
            --exclude='/frontend/node_modules/' \
            --exclude='/storage/' \
            -e "ssh -p $DEPLOY_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Build and activate release
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && bash deploy/cpanel/deploy-production.sh"
