name: Validate production merge

on:
  pull_request:
    branches:
      - prod

permissions:
  contents: read

concurrency:
  group: validate-prod-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test development before merge
    if: github.event.pull_request.head.ref == 'development'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: bibo_test
      DB_USERNAME: bibo_test
      DB_PASSWORD: bibo_test_password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: bibo_test
          MYSQL_USER: bibo_test
          MYSQL_PASSWORD: bibo_test_password
          MYSQL_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ubibo_test -pbibo_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out pull request
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, curl, dom, fileinfo, gd, mbstring, mysql, pdo_mysql, xml, zip
          coverage: none

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Prepare backend test environment
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force

      - name: Run backend tests
        working-directory: backend
        run: php artisan test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://erp.bibo.co.ke
        run: npm run build
