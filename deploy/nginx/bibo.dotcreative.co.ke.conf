server {
    server_name bibo.dotcreative.co.ke;

    client_max_body_size 170m;

    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate /etc/letsencrypt/live/bibo.dotcreative.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bibo.dotcreative.co.ke/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Laravel API — send EVERY /api request to public/index.php.
    # Do not try_files → /index.php; that internal redirect drops SCRIPT_FILENAME.
    location ^~ /api {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/bibo-erm/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/bibo-erm/backend/public;
        fastcgi_read_timeout 300;
    }

    location ^~ /sanctum {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/bibo-erm/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/bibo-erm/backend/public;
        fastcgi_read_timeout 300;
    }

    location = /up {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/bibo-erm/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/bibo-erm/backend/public;
    }

    location ^~ /storage/ {
        root /var/www/bibo-erm/backend/public;
        try_files $uri @laravel;
    }

    location ^~ /media/ {
        root /var/www/bibo-erm/backend/public;
        try_files $uri @laravel;
    }

    location @laravel {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/bibo-erm/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/bibo-erm/backend/public;
        fastcgi_read_timeout 300;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ~ /\. {
        deny all;
    }
}

server {
    listen 80;
    server_name bibo.dotcreative.co.ke;
    return 301 https://$host$request_uri;
}
