<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none">
  <rect width="200" height="150" fill="#F8FAFC"/>
  <!-- Building + door -->
  <rect x="20" y="8" width="160" height="28" fill="#64748B"/>
  <rect x="86" y="14" width="28" height="22" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="100" y="29" text-anchor="middle" font-size="7" fill="#92400E" font-family="system-ui,sans-serif">DOOR</text>
  <!-- Smooth curved front slab -->
  <path d="M40 36 L160 36 L160 68 Q100 132 40 68 Z" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
  <!-- Barricade along curve -->
  <path d="M40 68 Q100 128 160 68" stroke="#94A3B8" stroke-width="10" fill="none" stroke-linecap="butt"/>
  <!-- Open height zone above barricade -->
  <path d="M48 70 Q100 116 152 70 Q100 104 48 70 Z" fill="#93C5FD" fill-opacity="0.55" stroke="#2563EB" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="100" y="90" text-anchor="middle" font-size="7" fill="#1E3A8A" font-family="system-ui,sans-serif">OPEN ↑</text>
  <text x="100" y="142" text-anchor="middle" font-size="8" fill="#475569" font-family="system-ui,sans-serif">Curved front</text>
</svg>
