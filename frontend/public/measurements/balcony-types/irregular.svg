<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none">
  <rect width="200" height="150" fill="#F8FAFC"/>
  <!-- Building + door -->
  <rect x="20" y="8" width="160" height="28" fill="#64748B"/>
  <rect x="86" y="14" width="28" height="22" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <text x="100" y="29" text-anchor="middle" font-size="7" fill="#92400E" font-family="system-ui,sans-serif">DOOR</text>
  <!-- Three equal front-facing edges (bay / canted front) -->
  <path d="M44 36 L44 70 L72 108 L128 108 L156 70 L156 36 Z" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
  <!-- Barricade along three equal edges -->
  <path d="M44 70 L72 108 L128 108 L156 70" stroke="#94A3B8" stroke-width="10" fill="none" stroke-linecap="butt" stroke-linejoin="miter"/>
  <!-- Open height zone above barricade -->
  <path d="M52 72 L74 100 L126 100 L148 72 L126 88 L74 88 Z" fill="#93C5FD" fill-opacity="0.5" stroke="#2563EB" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="52" y="96" text-anchor="middle" font-size="6" fill="#1E3A8A" font-family="system-ui,sans-serif" transform="rotate(-50 52 96)">1</text>
  <text x="100" y="118" text-anchor="middle" font-size="7" fill="#1E3A8A" font-family="system-ui,sans-serif">2 equal</text>
  <text x="148" y="96" text-anchor="middle" font-size="6" fill="#1E3A8A" font-family="system-ui,sans-serif" transform="rotate(50 148 96)">3</text>
  <text x="100" y="140" text-anchor="middle" font-size="8" fill="#475569" font-family="system-ui,sans-serif">Three equal front edges</text>
</svg>
